<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https:; form-action 'self' https://github.com; base-uri 'none'">
    <title>Connect GitHub · Repo Runner</title>
    <link rel="stylesheet" href="./portal.css">
    <script type="module" src="./portal.mjs"></script>
  </head>
  <body>
    <header>Repo Runner <span>Sandbox</span></header>
    <main>
      <h1>Connect GitHub</h1>
      <p>Sign in, then approve the App in GitHub. Repo Runner will store the App credentials in the AWS account approved for this sandbox.</p>
      <p id="status" role="status" aria-live="polite">Checking setup…</p>
      <div class="actions">
        <button id="sign-in" type="button" hidden>Sign in</button>
        <button id="connect" type="button" hidden>Continue to GitHub</button>
        <button id="sign-out" class="secondary" type="button" hidden>Clear this tab’s session</button>
      </div>
    </main>
  </body>
</html>
